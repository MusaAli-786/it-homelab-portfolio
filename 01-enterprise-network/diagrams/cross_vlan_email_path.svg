<svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff">
<title>How traffic crosses from one VLAN to another</title>
<desc>An employee on the Workstations network sends an email. Since the mail server is on a different subnet, the packet goes to DC01, the router, which checks its firewall rules and forwards it to the Servers network.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="30" y="70" width="170" height="56" rx="8" fill="#e6f6f4" stroke="#2f9e8f" stroke-width="1"/>
<text x="115" y="90" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#1f2937">Employee PC</text>
<text x="115" y="108" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#4b5563">10.10.20.5 — Workstations</text>

<line x1="200" y1="98" x2="255" y2="98" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="255" y="55" width="170" height="86" rx="8" fill="#fdf1e0" stroke="#d69a2d" stroke-width="1"/>
<text x="340" y="80" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="600" fill="#1f2937">DC01</text>
<text x="340" y="98" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#4b5563">Routes + checks</text>
<text x="340" y="114" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#4b5563">firewall rules</text>

<line x1="425" y1="98" x2="480" y2="98" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="480" y="70" width="170" height="56" rx="8" fill="#e8f1fb" stroke="#3b82c4" stroke-width="1"/>
<text x="565" y="90" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#1f2937">Mail server</text>
<text x="565" y="108" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#4b5563">10.10.10.50 — Servers</text>

<text x="340" y="180" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#4b5563">Every cross-VLAN packet passes through this one checkpoint — nothing skips it</text>
</svg>
