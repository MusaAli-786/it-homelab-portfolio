<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff">
<title>Project 1 network layout</title>
<desc>A Windows Server running RRAS sits at the center, routing between four isolated subnets: Servers, Workstations, Management, and Guest.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<path d="M340 96 L340 120 L115 120 L115 148" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 96 L340 120 L265 120 L265 148" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 96 L340 120 L415 120 L415 148" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 96 L340 120 L565 120 L565 148" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="270" y="40" width="140" height="56" rx="8" fill="#eef2f7" stroke="#7a8794" stroke-width="1"/>
<text x="340" y="60" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="600" fill="#1f2937">Windows Server</text>
<text x="340" y="78" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#4b5563">RRAS router service</text>

<rect x="50" y="150" width="130" height="56" rx="8" fill="#e8f1fb" stroke="#3b82c4" stroke-width="1"/>
<text x="115" y="170" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#1f2937">Servers</text>
<text x="115" y="188" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#4b5563">10.10.10.0/24</text>

<rect x="200" y="150" width="130" height="56" rx="8" fill="#e6f6f4" stroke="#2f9e8f" stroke-width="1"/>
<text x="265" y="170" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#1f2937">Workstations</text>
<text x="265" y="188" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#4b5563">10.10.20.0/24</text>

<rect x="350" y="150" width="130" height="56" rx="8" fill="#fdf1e0" stroke="#d69a2d" stroke-width="1"/>
<text x="415" y="170" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#1f2937">Management</text>
<text x="415" y="188" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#4b5563">10.10.30.0/24</text>

<rect x="500" y="150" width="130" height="56" rx="8" fill="#eef0f2" stroke="#7a8794" stroke-width="1"/>
<text x="565" y="170" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#1f2937">Guest</text>
<text x="565" y="188" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#4b5563">10.10.40.0/24</text>

<text x="340" y="235" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#4b5563">All traffic between VLANs passes through the router and firewall rules</text>
</svg>
